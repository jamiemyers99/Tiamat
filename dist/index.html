<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0b14" />
    <title>Tiamat</title>
    <link rel="icon" href="./icon.png" />
    <style>html,body{background:#0c0b14;height:100%;margin:0;overflow:hidden}body{justify-content:center;align-items:center;font-family:system-ui,sans-serif;display:flex}#game{justify-content:center;align-items:center;width:100vw;height:100vh;display:flex}#game canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}#boot{color:#8a86a8;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;justify-content:center;align-items:center;font-size:13px;display:flex;position:fixed;inset:0}#touch{pointer-events:none;display:none;position:fixed;inset:0}#touch.on{display:block}#touch .pad{pointer-events:auto;touch-action:none;width:150px;height:150px;position:absolute;bottom:18px;left:18px}#touch .pad div,#touch .btn{color:#ffffffbf;-webkit-user-select:none;user-select:none;background:#ffffff24;border:2px solid #ffffff47;border-radius:12px;justify-content:center;align-items:center;font:700 16px system-ui;display:flex;position:absolute}#touch .pad .u{width:50px;height:50px;top:0;left:50px}#touch .pad .d{width:50px;height:50px;bottom:0;left:50px}#touch .pad .l{width:50px;height:50px;top:50px;left:0}#touch .pad .r{width:50px;height:50px;top:50px;right:0}#touch .btn{pointer-events:auto;touch-action:none;border-radius:50%;width:58px;height:58px}#touch .a{bottom:70px;right:22px}#touch .b{bottom:26px;right:92px}#touch .m{border-radius:10px;width:64px;height:34px;font-size:12px;top:18px;right:22px}</style>
    <script type="module" crossorigin src="./assets/index-Bx-vCMzZ.js"></script>
  </head>
  <body>
    <div id="boot">Loading Tiamat…</div>
    <div id="game"></div>
    <div id="touch">
      <div class="pad"><div class="u" data-k="up">▲</div><div class="d" data-k="down">▼</div><div class="l" data-k="left">◀</div><div class="r" data-k="right">▶</div></div>
      <div class="btn a" data-k="confirm">A</div><div class="btn b" data-k="cancel">B</div><div class="btn m" data-k="menu">MENU</div>
    </div>
  </body>
