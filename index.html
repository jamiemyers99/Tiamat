<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b14" />
    <meta name="description" content="Tiamat — Tales of the Riven Reach. An original creature-taming adventure." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Tiamat</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0c0b14; overflow: hidden; overscroll-behavior: none; }
      body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif;
             -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* #app holds everything. On a phone whose screen stays upright (auto-rotate off), main.js turns
         #app sideways (html.rot) so the game still fills the screen when the phone is held landscape. */
      #app { position: fixed; inset: 0; overflow: hidden; }
      html.rot #app { inset: auto; top: 0; left: 0; transform-origin: 0 0; }
      #game { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; }
      #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              color: #8a86a8; letter-spacing: .3em; font-size: 13px; text-transform: uppercase; pointer-events: none; }

      /* On-screen controls (phones and tablets). Sized from the screen height so they suit any phone. */
      #touch { position: absolute; inset: 0; pointer-events: none; display: none; --u: min(15vmin, 64px); }
      #touch.on { display: block; }
      #touch .pad { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
                    width: calc(var(--u) * 3); height: calc(var(--u) * 3); pointer-events: auto; touch-action: none; }
      #touch .pad div, #touch .btn { position: absolute; background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.28);
              border-radius: 12px; color: rgba(255,255,255,.75); font: 700 16px system-ui; display: flex; align-items: center; justify-content: center; }
      #touch .pad div { width: var(--u); height: var(--u); }
      #touch .pad .u { left: var(--u); top: 0; }
      #touch .pad .d { left: var(--u); bottom: 0; }
      #touch .pad .l { left: 0; top: var(--u); }
      #touch .pad .r { right: 0; top: var(--u); }
      #touch .btn { pointer-events: auto; width: calc(var(--u) * 1.15); height: calc(var(--u) * 1.15); border-radius: 50%; touch-action: none; }
      #touch .a { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(var(--u) * 1.2 + 12px); }
      #touch .b { right: calc(var(--u) * 1.35 + 18px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
      #touch .run { right: calc(var(--u) * 1.35 + 18px + env(safe-area-inset-right, 0px)); bottom: calc(var(--u) * 1.45 + 24px);
                    width: calc(var(--u) * 0.95); height: calc(var(--u) * 0.7); border-radius: 10px; font-size: 11px; }
      #touch .m { right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
                  width: 70px; height: 34px; border-radius: 10px; font-size: 12px; }
      #touch [data-k].down { background: rgba(255, 214, 92, .35); border-color: rgba(255, 214, 92, .7); }
      /* in menus, battles and conversations the buttons fade so the text under them stays readable */
      #touch.dim .pad div, #touch.dim .btn { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.5); }
      #touch.dim [data-k].down { background: rgba(255, 214, 92, .3); border-color: rgba(255, 214, 92, .6); }

    </style>
  </head>
  <body>
    <div id="app">
    <div id="boot">Loading Tiamat…</div>
    <div id="game"></div>
    <div id="touch">
      <div class="pad"><div class="u" data-k="up">▲</div><div class="d" data-k="down">▼</div><div class="l" data-k="left">◀</div><div class="r" data-k="right">▶</div></div>
      <div class="btn a" data-k="confirm">A</div><div class="btn b" data-k="cancel">B</div>
      <div class="btn run" data-k="run">RUN</div><div class="btn m" data-k="menu">MENU</div>
    </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
